{% extends 'base.html' %}{% block content %}<section class="card narrow"><h1>{{ 'Edit employee' if person else 'Add employee' }}</h1><form method="post">{{ csrf() }}<label>Full name<input name="full_name" value="{{ person.full_name if person else '' }}" required maxlength="100"></label><label>Username<input name="username" value="{{ person.username if person else '' }}" required pattern="[A-Za-z0-9_.-]{3,40}" minlength="3" maxlength="40"></label><label>{{ 'New password (leave blank to keep current)' if person else 'Password' }}<input name="password" type="password" autocomplete="new-password" minlength="12" {% if not person %}required{% endif %}></label><p class="muted">Use at least 12 characters. Share passwords privately.</p><label class="check"><input name="is_active" type="checkbox" value="1" {% if not person or person.is_active %}checked{% endif %}> Active account</label><p class="muted">Deactivating an employee closes any open attendance session.</p><button>Save employee</button> <a href="{{ url_for('admin') }}">Cancel</a></form></section>{% endblock %}
